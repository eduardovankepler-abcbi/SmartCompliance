services:
  - type: static
    name: smart-compliance-frontend-angular
    rootDir: frontend-angular
    buildCommand: npm install && npm run build -- --configuration=production
    staticPublishPath: dist/frontend-angular/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: smart-compliance-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: mysql
      - key: AUTH_SECRET
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: smart_compliance
      - key: CORS_ORIGIN
        sync: false
